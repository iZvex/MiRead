name: Build MiRear APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Configure all four MIREAR_* repository Actions secrets to sign every
      # build with one persistent key. Without them, use the runner debug key.
      - name: Sign APK with persistent MiRear key
        if: ${{ secrets.MIREAR_KEYSTORE_BASE64 != '' }}
        env:
          MIREAR_KEYSTORE_BASE64: ${{ secrets.MIREAR_KEYSTORE_BASE64 }}
          MIREAR_STORE_PASSWORD: ${{ secrets.MIREAR_STORE_PASSWORD }}
          MIREAR_KEY_ALIAS: ${{ secrets.MIREAR_KEY_ALIAS }}
          MIREAR_KEY_PASSWORD: ${{ secrets.MIREAR_KEY_PASSWORD }}
        run: |
          echo "$MIREAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mirear-release.jks"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mirear-release.jks" \
            --ks-key-alias "$MIREAR_KEY_ALIAS" \
            --ks-pass env:MIREAR_STORE_PASSWORD \
            --key-pass env:MIREAR_KEY_PASSWORD \
            --out "$RUNNER_TEMP/MiRear-debug-signed.apk" "$APK"
          mv "$RUNNER_TEMP/MiRear-debug-signed.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          rm -f "$RUNNER_TEMP/mirear-release.jks"

      - name: Warn when persistent signing is not configured
        if: ${{ secrets.MIREAR_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Persistent signing is not configured. APK updates may require uninstalling the previous build."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiRear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
