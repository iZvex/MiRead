name: Build MiRear APK

on:
  push:
    branches: [ main, experimental/texture-mirror ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Sign APK with persistent MiRear key (when configured)
        env:
          MIREAR_KEYSTORE_BASE64: ${{ secrets.MIREAR_KEYSTORE_BASE64 }}
          MIREAR_STORE_PASSWORD: ${{ secrets.MIREAR_STORE_PASSWORD }}
          MIREAR_KEY_ALIAS: ${{ secrets.MIREAR_KEY_ALIAS }}
          MIREAR_KEY_PASSWORD: ${{ secrets.MIREAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -n "$MIREAR_KEYSTORE_BASE64" ]; then
            for name in MIREAR_STORE_PASSWORD MIREAR_KEY_ALIAS MIREAR_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Signing secret $name is empty. Check GitHub Actions secrets."
                exit 1
              fi
            done

            KEYSTORE="$RUNNER_TEMP/mirear-release.jks"
            printf '%s' "$MIREAR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            if [ ! -s "$KEYSTORE" ]; then
              echo "::error::Decoded keystore is empty. Recreate MIREAR_KEYSTORE_BASE64 from the original .jks/.keystore file."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE" -storepass "$MIREAR_STORE_PASSWORD" -alias "$MIREAR_KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Keystore cannot be opened or the alias/password is incorrect. Recheck the Base64 keystore, store password and alias secrets."
              exit 1
            fi

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$MIREAR_KEY_ALIAS" \
              --ks-pass env:MIREAR_STORE_PASSWORD \
              --key-pass env:MIREAR_KEY_PASSWORD \
              --out "$RUNNER_TEMP/MiRear-debug-signed.apk" "$APK"
            mv "$RUNNER_TEMP/MiRear-debug-signed.apk" "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
            rm -f "$KEYSTORE"
            echo "APK signed with the persistent MiRear key."
          else
            echo "::warning::Persistent signing is not configured. APK updates may require uninstalling the previous build."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiRear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
